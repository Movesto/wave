rules:
  # ---- PATH: sink = fs read; sanitiser = path.basename ----
  - id: path-flow
    mode: taint
    pattern-sources: [{pattern: req.query.$X}, {pattern: req.body.$X}, {pattern: req.params.$X}]
    pattern-sinks: [{pattern: fs.readFileSync(...)}, {pattern: fs.readFile(...)}, {pattern: fs.createReadStream(...)}]
    message: path flow
    languages: [typescript]
    severity: INFO
  - id: path-unsanitized
    mode: taint
    pattern-sources: [{pattern: req.query.$X}, {pattern: req.body.$X}, {pattern: req.params.$X}]
    pattern-sinks: [{pattern: fs.readFileSync(...)}, {pattern: fs.readFile(...)}, {pattern: fs.createReadStream(...)}]
    pattern-sanitizers: [{pattern: path.basename(...)}]
    message: path tainted-unsanitized
    languages: [typescript]
    severity: WARNING

  # ---- COMMAND: dangerous sink = exec/execSync (execFile is a different, safe sink) ----
  - id: command-flow
    mode: taint
    pattern-sources: [{pattern: req.query.$X}, {pattern: req.body.$X}, {pattern: req.params.$X}]
    pattern-sinks: [{pattern: child_process.exec(...)}, {pattern: child_process.execSync(...)}, {pattern: exec(...)}, {pattern: execSync(...)}]
    pattern-sanitizers: [{pattern: escapeshellarg(...)}]
    message: command tainted-unsanitized
    languages: [typescript]
    severity: WARNING

  # ---- XSS: sink = innerHTML/document.write; sanitiser = DOMPurify (textContent is a diff sink) ----
  - id: xss-flow
    mode: taint
    pattern-sources: [{pattern: req.query.$X}, {pattern: req.body.$X}, {pattern: req.params.$X}]
    pattern-sinks: [{pattern: $EL.innerHTML = $V}, {pattern: document.write(...)}]
    pattern-sanitizers: [{pattern: DOMPurify.sanitize(...)}]
    message: xss tainted-unsanitized
    languages: [typescript]
    severity: WARNING
