rules:
  - id: dvna-command
    mode: taint
    pattern-sources: [{pattern: req.body.$X}, {pattern: req.query.$X}, {pattern: req.params.$X}]
    pattern-sinks: [{pattern: exec(...)}, {pattern: execSync(...)}, {pattern: child_process.exec(...)}, {pattern: spawn(...)}]
    message: command injection
    languages: [javascript, typescript]
    severity: ERROR
  - id: dvna-code-eval
    mode: taint
    pattern-sources: [{pattern: req.body.$X}, {pattern: req.query.$X}, {pattern: req.params.$X}]
    pattern-sinks: [{pattern: eval(...)}, {pattern: mathjs.eval(...)}, {pattern: $M.eval(...)}]
    message: code injection (eval)
    languages: [javascript, typescript]
    severity: ERROR
  - id: dvna-sqli
    mode: taint
    pattern-sources: [{pattern: req.body.$X}, {pattern: req.query.$X}, {pattern: req.params.$X}]
    pattern-sinks: [{pattern: $DB.sequelize.query(...)}, {pattern: $DB.query(...)}, {pattern: sequelize.query(...)}]
    message: sql injection (raw query)
    languages: [javascript, typescript]
    severity: ERROR
  - id: dvna-open-redirect
    mode: taint
    pattern-sources: [{pattern: req.body.$X}, {pattern: req.query.$X}, {pattern: req.params.$X}]
    pattern-sinks: [{pattern: res.redirect(...)}]
    message: open redirect
    languages: [javascript, typescript]
    severity: ERROR
  - id: dvna-deserialize
    mode: taint
    pattern-sources: [{pattern: req.files.$X}, {pattern: req.body.$X}, {pattern: req.query.$X}]
    pattern-sinks: [{pattern: serialize.unserialize(...)}, {pattern: unserialize(...)}]
    message: insecure deserialization
    languages: [javascript, typescript]
    severity: ERROR
  - id: dvna-xxe
    patterns:
      - pattern: "libxmljs.parseXmlString(..., {..., noent: true, ...})"
    message: XXE (noent enables external entities)
    languages: [javascript, typescript]
    severity: ERROR
