rules:
  - id: xf-command
    mode: taint
    pattern-sources: [{pattern: req.body.$X},{pattern: req.query.$X},{pattern: req.params.$X},{pattern: req.headers.$X}]
    pattern-sinks: [{pattern: child_process.exec(...)},{pattern: child_process.execSync(...)},{pattern: exec(...)},{pattern: execSync(...)},{pattern: spawn(...)}]
    message: command injection
    languages: [javascript, typescript]
    severity: ERROR
  - id: xf-sql
    mode: taint
    pattern-sources: [{pattern: req.body.$X},{pattern: req.query.$X},{pattern: req.params.$X}]
    pattern-sinks: [{pattern: $DB.query(...)},{pattern: $DB.raw(...)},{pattern: $DB.$SEQ.query(...)}]
    message: sql injection
    languages: [javascript, typescript]
    severity: ERROR
  - id: xf-path
    mode: taint
    pattern-sources: [{pattern: req.body.$X},{pattern: req.query.$X},{pattern: req.params.$X}]
    pattern-sinks: [{pattern: fs.readFile(...)},{pattern: fs.readFileSync(...)},{pattern: fs.createReadStream(...)},{pattern: $R.sendFile(...)}]
    message: path traversal
    languages: [javascript, typescript]
    severity: ERROR
  - id: xf-ssrf
    mode: taint
    pattern-sources: [{pattern: req.body.$X},{pattern: req.query.$X},{pattern: req.params.$X}]
    pattern-sinks: [{pattern: axios(...)},{pattern: axios.get(...)},{pattern: axios.post(...)},{pattern: fetch(...)},{pattern: http.get(...)},{pattern: got(...)}]
    message: ssrf
    languages: [javascript, typescript]
    severity: ERROR
